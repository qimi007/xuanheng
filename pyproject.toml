[project]
name = "map-tool"
version = "0.1.0"
description = "地图工具桌面应用"
requires-python = ">=3.11"
dependencies = [
    "anyio==4.*",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "pydantic==2.*",
    "pytauri==0.8.*",
    "pytauri-wheel==0.8.*",
    "pywebview>=4.0",
    "waitress>=2.0.0",
    "zstandard>=0.22.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
